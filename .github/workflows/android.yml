name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:      # можна запустити вручну з UI, без нового коміта

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # щоб можна було записати лог у гілку ci-logs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 прибрано: він deprecated і падає.
      # На раннерах Ubuntu Android SDK уже стоїть у /usr/local/lib/android/sdk,
      # ANDROID_HOME заданий. Доставляємо лише те, чого може не вистачати.
      - name: Доставити компоненти Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "build-tools:"; ls "$SDK/build-tools" 2>/dev/null || echo "  немає"
          echo "platforms:";   ls "$SDK/platforms"   2>/dev/null || echo "  немає"

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
              || echo "::warning::sdkmanager не зміг доставити компоненти — сподіваємось на preinstalled"
          else
            echo "::warning::cmdline-tools не знайдено, покладаємось на preinstalled SDK"
          fi

      - name: Кеш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Встановити Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        run: |
          cd android
          # Підстраховка: явно вказуємо Gradle, де шукати SDK
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --warning-mode summary 2>&1 | tee ../build.log

      - name: Показати розмір APK
        if: always()
        run: |
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK не зібрано"

      # Лог завжди — щоб у разі червоного запуску помилку можна було прочитати.
      # API віддає артефакти лише з правами адміна, тому додатково копіюємо лог
      # у гілку ci-logs: її видно будь-кому через git, без зайвих кліків.
      - name: Зберегти лог у гілку ci-logs
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/ci-logs:refs/remotes/origin/ci-logs" || true

          if git show-ref --verify --quiet refs/remotes/origin/ci-logs; then
            git checkout -B ci-logs refs/remotes/origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf --cached . > /dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name build.log -exec rm -rf {} + 2>/dev/null || true
          fi

          mkdir -p logs
          cp build.log "logs/${{ github.run_id }}.log"
          git add -f logs
          git commit -m "log ${{ github.run_id }} (${{ github.sha }}) ${{ job.status }}" || exit 0
          git push origin ci-logs

      - name: Вивантажити лог і APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Вивантажити APK (стабільне ім'я)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trip-tracker-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
