version: '3.8'

services:
  trip-tracker:
    build: .
    container_name: trip-tracker
    restart: always
    ports:
      - "8851:3000"
    environment:
      - PORT=${PORT:-3000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-2856023b}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_12345}
    volumes:
      - ./data:/app/data