version: '3.8'

services:
  trip-tracker:
    build: .
    container_name: trip-tracker
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8851}:${PORT:-8851}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8851}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Будь ласка, вкажіть ADMIN_PASSWORD у файлі .env}
      - JWT_SECRET=${JWT_SECRET:?Будь ласка, вкажіть JWT_SECRET у файлі .env}
    volumes:
      - ./data:/app/data